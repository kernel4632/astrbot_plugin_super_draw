[project]
name = "astrbot_plugin_super_draw"
version = "5.1.0"
description = "AstrBot 超级生图插件，按生图、用户和设置分目录，支持 OpenAI Images、OpenAI Chat 和 Gemini。"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.23.0",
    "google-genai>=1.33.0",
    "aiohttp>=3.9.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
